# alembic.ini

[alembic]
# Location of Alembic migration scripts
script_location = %(here)s/alembic

# Database URL is loaded from src/configure/settings.py
# in alembic/env.py, so we don't hardcode credentials here.
sqlalchemy.url=postgresql+asyncpg://postgres:thangam@localhost:5432/voice_agent_db

# File name template used when generating migration files
file_template = %%(rev)s_%%(slug)s

# Timezone used for migration file timestamps
# timezone =

# Maximum length of migration filename slug
truncate_slug_length = 40


[post_write_hooks]
# Hooks can be configured here for formatting generated migrations.
# Leave empty initially.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S