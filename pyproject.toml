[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-ai-voice-agent"
version = "1.0.0"
description = "Enterprise AI Voice Agent for Hospital Appointment Booking using LangGraph, FastAPI, Twilio, Deepgram, ElevenLabs, PostgreSQL, and Qdrant."
readme = "README.md"
requires-python = ">=3.11,<3.13"

authors = [
    { name = "Your Name" }
]

dependencies = [
    # ==========================
    # Backend
    # ==========================
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",

    # ==========================
    # LangChain / LangGraph
    # ==========================
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "langchain-core>=0.3.74",
    "langgraph>=0.6.6",
    "langsmith>=0.4.18",

    # ==========================
    # LLM
    # ==========================
    "langchain-groq>=0.3.7",

    # ==========================
    # Embeddings & Vector DB
    # ==========================
    "sentence-transformers>=5.1.0",
    "qdrant-client>=1.15.1",

    # ==========================
    # Database
    # ==========================
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2.9",
    "alembic>=1.16.4",

    # ==========================
    # Validation & Config
    # ==========================
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",

    # ==========================
    # Authentication
    # ==========================
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",

    # ==========================
    # Voice
    # ==========================
    "twilio>=9.8.0",
    "deepgram-sdk>=4.8.1",
    "elevenlabs>=2.11.0",

    # ==========================
    # Async & HTTP
    # ==========================
    "httpx>=0.28.1",
    "aiofiles>=24.1.0",

    # ==========================
    # Observability
    # ==========================
    "prometheus-client>=0.22.1",

    # ==========================
    # Utilities
    # ==========================
    "pandas>=2.3.2",
    "numpy>=2.3.2",
    "orjson>=3.11.2",
    "tenacity>=9.1.2",
    "python-multipart>=0.0.20",

    # ==========================
    # Logging
    # ==========================
    "loguru>=0.7.3"
]

[project.optional-dependencies]

dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.9",
    "mypy>=1.17.1",
    "pre-commit>=4.3.0"
]

dashboard = [
    "streamlit>=1.48.1"
]

rag = [
    "docling>=2.48.0",
    "pymupdf>=1.26.4"
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*"
]